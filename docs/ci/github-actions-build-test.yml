name: build-test

on:
  push:
    branches:
      - main
      - arena/**
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Show .NET info
        run: dotnet --info

      - name: Restore
        run: dotnet restore IGBZ.sln

      - name: Build
        run: dotnet build IGBZ.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test IGBZ.sln --configuration Release --no-build --verbosity normal
